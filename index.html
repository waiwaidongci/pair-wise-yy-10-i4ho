<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>漆线雕阴干室交接簿</title>
  <style>
    :root {
      --bg: #eef3f0; --panel: #ffffff; --ink: #1e2624; --muted: #62706b;
      --line: #ccd8d2; --teal: #1f6b68; --red: #a43f42; --amber: #aa7a24;
      --violet: #665c93; --gold: #9a7b1f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; font-size: 14px; }
    header { padding: 18px 24px 12px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 16px; align-items: end; flex-wrap: wrap; }
    h1 { margin: 0 0 4px; font-size: 23px; }
    h2 { margin: 0 0 10px; font-size: 16px; }
    h3 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; }
    .meta { color: var(--muted); font-size: 12px; line-height: 1.6; }
    main { padding: 16px 24px 30px; display: grid; gap: 14px; }
    button, input, select { font: inherit; border-radius: 6px; }
    input, select { border: 1px solid var(--line); padding: 8px 9px; background: #fff; color: var(--ink); min-width: 0; }
    button { border: 0; background: var(--teal); color: #fff; padding: 8px 12px; cursor: pointer; min-height: 34px; }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: #5d6764; }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    button.amber { background: var(--amber); }
    button.gold { background: var(--gold); }
    label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 13px; }
    .tabs { display: flex; gap: 8px; }
    .tab { background: #dfe8e3; color: var(--ink); font-weight: 600; }
    .tab.on { background: var(--teal); color: #fff; }
    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 14px; align-items: start; }
    .side { display: grid; gap: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .orow { display: grid; grid-template-columns: 1fr 30px; gap: 7px; margin-bottom: 7px; align-items: center; }
    .orow .cab, .orow .st, .orow .en { grid-column: 1 / 3; }
    .orow .delrow { padding: 0; min-height: 32px; }
    .witem { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 7px 9px; margin-bottom: 7px; cursor: pointer; }
    .witem.pick { border-left-color: var(--violet); background: #f2f0f8; }
    .view { display: none; }
    .view.show { display: grid; gap: 14px; }
    .group { margin-bottom: 12px; }
    .group.hide { display: none; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; background: #fbfdfb; }
    .card.archived { background: #f6f4ee; }
    .card-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 5px; }
    .in { margin-bottom: 6px; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .card-actions button { font-size: 12px; padding: 6px 9px; min-height: 0; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; vertical-align: 1px; margin-left: 6px; }
    .badge-teal { background: #dcece9; color: var(--teal); }
    .badge-red { background: #f3dddd; color: var(--red); }
    .badge-amber { background: #f3e8cf; color: var(--amber); }
    .badge-violet { background: #e6e2f2; color: var(--violet); }
    .badge-gold { background: #efe6c4; color: var(--gold); }
    .badge-muted { background: #e4e9e6; color: var(--muted); }
    .flag { font-size: 12px; border-radius: 6px; padding: 5px 8px; margin: 5px 0; }
    .flag.red { background: #f3dddd; color: var(--red); }
    .flag.amber { background: #f3e8cf; color: var(--amber); }
    .flag.gold { background: #efe6c4; color: var(--gold); }
    .marks { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
    .marks th, .marks td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
    .marks tr.bad td { background: #f8eaea; color: var(--red); }
    .todo-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 7px; padding: 9px 11px; margin-bottom: 8px; background: #fbfdfb; }
    .filters { display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 9px; }
    .receipt { border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; margin-bottom: 8px; background: #fbfdfb; }
    .receipt.ok { border-left: 4px solid var(--teal); }
    .receipt.no { border-left: 4px solid var(--red); }
    .banner { border-radius: 7px; padding: 8px 10px; margin-top: 8px; font-size: 13px; line-height: 1.7; }
    .banner.ok { background: #dcece9; color: var(--teal); }
    .banner.no { background: #f3dddd; color: var(--red); }
    .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
    table.log { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.log th, table.log td { border: 1px solid var(--line); padding: 4px 7px; text-align: left; vertical-align: top; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(520px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    #dlgBody { padding: 16px; display: grid; gap: 10px; }
    #dlgBody h3 { margin: 0; font-size: 16px; }
    .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .dlg-actions button { min-width: 92px; }
    .archive-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 980px) {
      .layout, .archive-grid { grid-template-columns: 1fr; }
      .orow { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>漆线雕阴干室交接簿</h1>
      <div class="meta" id="digest">载入中…</div>
    </div>
    <div class="tabs">
      <button class="tab on" data-action="tab" data-tab="ledger">交接簿列表</button>
      <button class="tab" id="tabTodo" data-action="tab" data-tab="todo">待办</button>
      <button class="tab" data-action="tab" data-tab="archive">履历存档</button>
    </div>
  </header>

  <main>
    <div class="layout">
      <!-- 左侧：沿用的作品档案 + 投递绑柜单 -->
      <div class="side">
        <section class="panel">
          <h2>作品档案（沿用当前作品）</h2>
          <div id="workList"></div>
          <button data-action="addWork" class="secondary">新增作品</button>
        </section>

        <section class="panel">
          <h2>投递绑柜单</h2>
          <div class="meta" style="margin-bottom:8px">一单一令牌：重复投递读回原单；任一条目冲突则整单退回、不留残单。</div>
          <form id="orderForm">
            <div id="orderRows"></div>
            <div style="display:flex;gap:8px">
              <button type="button" class="secondary" data-action="addRow">加一行</button>
              <button type="button" data-action="submitOrder" style="flex:1">投递本单</button>
            </div>
          </form>
          <div id="submitResult"></div>
          <h2 style="margin-top:12px">最近回执</h2>
          <div id="lastReceipt"></div>
        </section>
      </div>

      <!-- 右侧三视图 -->
      <div>
        <section id="view-ledger" class="view show">
          <div class="panel">
            <div class="filters">
              <label>检索（纹样/胎体/柜位/单号）<input id="textFilter" placeholder="如：折枝梅 或 A1"></label>
              <label>状态筛选<select id="statusFilter"></select></label>
              <label>&nbsp;<button class="secondary" data-action="" id="clearFilter">清空筛选</button></label>
            </div>
          </div>
          <div id="ledgerBody" style="margin-top:12px"></div>
        </section>

        <section id="view-todo" class="view">
          <div class="panel">
            <h2>待办队列（与列表同源）</h2>
            <div class="meta">待入柜／待复检／复检到期／可上金粉；续干条件未满足不会出现上金粉待办。</div>
            <div id="todoBody" style="margin-top:8px"></div>
          </div>
        </section>

        <section id="view-archive" class="view">
          <div class="archive-grid">
            <section class="panel">
              <h2>作废许可留档</h2>
              <div class="meta">胎体、纹样或柜位履历变更即止，按新值重算；旧入柜与称重条目保留在此，不参与判定。</div>
              <div id="archiveBody" style="margin-top:8px"></div>
            </section>
            <section class="panel">
              <h2>投递与判定参数</h2>
              <div class="grid2">
                <label>温度下限 ℃<input id="setTempMin" type="number" step="0.1"></label>
                <label>温度上限 ℃<input id="setTempMax" type="number" step="0.1"></label>
                <label>湿度下限 %<input id="setHumMin" type="number"></label>
                <label>湿度上限 %<input id="setHumMax" type="number"></label>
              </div>
              <div class="meta" style="margin:6px 0">参数变更只触发按新值重算；复检间隔固定廿四小时，失重分五档（返潮／稳定／轻失／中失／急失）。</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button data-action="saveSettings">保存参数并重算</button>
                <button class="secondary" data-action="reload">从存档重算（一致性核对）</button>
              </div>
              <div id="reloadResult"></div>
              <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
                <button class="violet" data-action="exportData">导出事件存档</button>
                <label class="violet" style="color:#fff;background:var(--violet);border-radius:6px;padding:8px 12px;cursor:pointer">导入存档<input id="importFile" type="file" accept="application/json" hidden></label>
                <button class="danger" data-action="resetData">重置为示例</button>
              </div>
            </section>
          </div>
          <section class="panel" style="margin-top:12px">
            <h2>投递回执</h2>
            <div id="receiptBody"></div>
          </section>
          <section class="panel" style="margin-top:12px">
            <h2>事件日志（只追加）</h2>
            <table class="log">
              <thead><tr><th>时间</th><th>事件</th><th>ID</th><th>内容</th></tr></thead>
              <tbody id="eventBody"></tbody>
            </table>
          </section>
        </section>
      </div>
    </div>

    <datalist id="cabList">
      <option value="A1"><option value="A2"><option value="A3">
      <option value="B1"><option value="B2"><option value="B3">
    </datalist>

    <dialog id="dlg">
      <div id="dlgBody"></div>
    </dialog>
  </main>

  <script src="app/rules.js"></script>
  <script src="app/store.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
